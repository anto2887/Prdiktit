# railway.toml
# Default backend service (main API)
[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile.prod"

[deploy]
startCommand = "gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"

# scheduler service (must be before frontend to ensure proper config)
[[services]]
name = "scheduler"
source = "backend"

[services.build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile.scheduler"

[services.deploy]
startCommand = "python -m app.scheduler_minimal"

# frontend service
[[services]]
name = "frontend"
source = "frontend"

[services.build]
builder = "dockerfile"
dockerfilePath = "frontend/Dockerfile"

[services.deploy]
startCommand = "nginx -g 'daemon off;'"