# 1. Backend Service
[backend.build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile.prod"

[backend.deploy]
startCommand = "gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"

# 2. Scheduler Service
[scheduler.build]
builder = "dockerfile"
dockerfilePath = "scheduler/Dockerfile"

[scheduler.deploy]
startCommand = "python -m app.scheduler_minimal"

# 3. Frontend Service
[frontend.build]
builder = "dockerfile"
dockerfilePath = "frontend/Dockerfile"

[frontend.deploy]
startCommand = "nginx -g 'daemon off;'"